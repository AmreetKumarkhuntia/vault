[workspace]
resolver = "2"
members = [
    "crates/dsl",
    "crates/store",
    "crates/store-postgres",
    "crates/store-redis",
    "crates/mock",
    "crates/core",
    "crates/report",
    "crates/cli",
    "examples/demo-target",
    "tests",
]

[workspace.package]
version = "0.2.0" # x-release-please-version
edition = "2021"
license = "MIT"
repository = "https://github.com/AmreetKumarkhuntia/vault"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
