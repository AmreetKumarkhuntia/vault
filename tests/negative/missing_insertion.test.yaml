test: missing insertion demo
description: Deliberately fails to showcase the near-miss report — expects `confirmed` while the target writes `pending`
tags: [negative]
skip: "${env.VAULT_RUN_NEGATIVE:-failure showcase — enable with VAULT_RUN_NEGATIVE=}"

seed:
  postgres:
    - table: users
      rows: [{ id: 1, email: alice@example.com, status: active }]
    - table: wallets
      rows: [{ user_id: 1, balance_cents: 50000, currency: USD }]

mocks:
  payments:
    stubs:
      - name: charge-ok
        match: { method: POST, path: /v1/charges }
        response: { status: 201, json: { id: "ch_{{ uuid() }}", status: succeeded } }
  email:
    stubs:
      - name: send-ok
        match: { method: POST, path: /send }
        response: { status: 202 }

steps:
  - name: create
    request:
      method: POST
      path: /api/orders
      json: { user_id: 1, items: [{ sku: SKU-BOOK, qty: 1, price_cents: 2500 }] }
    expect: { status: 201 }
    capture:
      order_id: { jsonpath: $.id }

verify:
  postgres:
    - table: orders
      expect:
        - id: "{{ order_id }}"
          user_id: 1
          status: confirmed        # wrong on purpose: the target writes 'pending'
          total_cents: 2500
          created_at: !near-now 10s
      count: exact
      eventually: 2s
  unexpected: allow
