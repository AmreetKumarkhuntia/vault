test: SQL file fixture seeds an order
description: Declaration-relative exact, glob, and external SQL files compose in order
tags: [orders, fixtures, smoke]

seed:
  postgres:
    # Exact and glob paths resolve from this test file's orders/ directory.
    - sql_file: ../fixtures/sql_file_order.sql
    - sql_glob: "../fixtures/sql_file_order/*.sql"
    # Parent traversal is allowed; this fixture lives outside the suite directory.
    - sql_file: ../../shared-fixtures/sql_file_order_external.sql
    - sql: >-
        UPDATE orders SET status = 'fixture-ready'
        WHERE id = 7101 AND status = 'fixture-external';

steps:
  - name: fetch fixture order
    request: { method: GET, path: /api/orders/7101 }
    expect:
      status: 200
      json_partial:
        id: 7101
        user_id: 7001
        status: fixture-ready
        total_cents: 3200
        external_charge_id: fixture_charge

verify:
  postgres:
    - table: vault_fixture_baseline
      expect: [{ fixture_key: suite-global, fixture_value: loaded }]
    - table: users
      expect: [{ id: 7001, email: sql-fixture@example.com, status: active, plan: pro }]
    - table: wallets
      expect: [{ user_id: 7001, balance_cents: 42000, currency: USD }]
    - table: orders
      expect: [{ id: 7101, user_id: 7001, status: fixture-ready, total_cents: 3200 }]
    - table: audit_log
      expect: [{ entity: order, entity_id: "7101", action: fixture-loaded }]
