# The whole release pipeline lives in one workflow: tags/releases created with
# GITHUB_TOKEN do not trigger other workflows, so a separate `on: release`
# build would silently never run.
#
# Release model: no release branches or PRs. On every push to main the
# `version` job computes the next semver from conventional commits since the
# last tag; when a release is due it commits the bump (Cargo.toml + Cargo.lock
# + CHANGELOG.md) straight to main as `chore(release): vX.Y.Z`, tags that
# commit, creates the GitHub Release, and the build/publish jobs deploy from
# that exact commit.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild/upload assets for (e.g. v0.2.0). Empty = dry-run build of HEAD, no upload."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    # The release commit itself must not trigger another release.
    if: >-
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.decide.outputs.release_created }}
      tag_name: ${{ steps.decide.outputs.tag_name }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: compute next version from conventional commits
        id: decide
        run: |
          set -euo pipefail
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE=${LAST_TAG:+${LAST_TAG}..HEAD}
          SUBJECTS=$(git log --format='%s' ${RANGE:-HEAD})
          FULL=$(git log --format='%s%n%b' ${RANGE:-HEAD})

          BUMP=none
          if echo "$FULL" | grep -qE '^[a-z]+(\([^)]*\))?!: |^BREAKING CHANGE'; then
            BUMP=major
          elif echo "$SUBJECTS" | grep -qE '^feat(\([^)]*\))?: '; then
            BUMP=minor
          elif echo "$SUBJECTS" | grep -qE '^(fix|perf)(\([^)]*\))?: '; then
            BUMP=patch
          fi

          CURRENT=$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)" # x-release-version$/\1/p' Cargo.toml)
          test -n "$CURRENT" || { echo "version marker not found in Cargo.toml"; exit 1; }

          if [ "$BUMP" = "none" ]; then
            echo "no feat/fix/breaking commits since ${LAST_TAG:-the beginning} — no release"
            echo "release_created=false" >> "$GITHUB_OUTPUT"
            echo "tag_name=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pre-1.0 semver: breaking changes bump the minor, not to 1.0.0.
          NEW=$(echo "$CURRENT" | awk -F. -v bump="$BUMP" '{
            major=$1; minor=$2; patch=$3;
            if (major == 0 && bump == "major") bump = "minor";
            if (bump == "major")      { major++; minor=0; patch=0 }
            else if (bump == "minor") { minor++; patch=0 }
            else                      { patch++ }
            printf "%d.%d.%d", major, minor, patch
          }')
          echo "bump: $BUMP  $CURRENT -> $NEW"
          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$NEW" >> "$GITHUB_OUTPUT"
          echo "NEW_VERSION=$NEW" >> "$GITHUB_ENV"
          echo "LAST_TAG=$LAST_TAG" >> "$GITHUB_ENV"

      - name: write release commit (version + lockfile + changelog)
        if: steps.decide.outputs.release_created == 'true'
        run: |
          set -euo pipefail
          sed -i -E "s/^version = \"[0-9]+\.[0-9]+\.[0-9]+\" # x-release-version$/version = \"${NEW_VERSION}\" # x-release-version/" Cargo.toml
          cargo update --workspace

          RANGE=${LAST_TAG:+${LAST_TAG}..HEAD}
          {
            echo "## v${NEW_VERSION} ($(date -u +%F))"
            echo
            for section in "Features:feat" "Fixes:fix|perf" "Other:docs|ci|chore|refactor|style|test"; do
              title=${section%%:*}; types=${section#*:}
              LINES=$(git log --format='- %s (%h)' ${RANGE:-HEAD} | grep -E "^- (${types})(\([^)]*\))?!?: " || true)
              if [ -n "$LINES" ]; then
                echo "### ${title}"
                echo "$LINES" | sed -E 's/^- [a-z]+(\([^)]*\))?!?: /- /'
                echo
              fi
            done
          } > /tmp/release-notes.md

          touch CHANGELOG.md
          cat /tmp/release-notes.md CHANGELOG.md > /tmp/changelog.md
          mv /tmp/changelog.md CHANGELOG.md

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push --atomic origin main "v${NEW_VERSION}"

      - name: create GitHub release
        if: steps.decide.outputs.release_created == 'true'
        run: gh release create "v${NEW_VERSION}" --title "v${NEW_VERSION}" --notes-file /tmp/release-notes.md

  build:
    needs: version
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.version.outputs.release_created == 'true'
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ inputs.tag || needs.version.outputs.tag_name || 'v0.0.0-dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || needs.version.outputs.tag_name || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: install musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --release --locked -p vault --target ${{ matrix.target }}
      - name: smoke test
        run: ./target/${{ matrix.target }}/release/vault --version
      - name: package
        run: bash scripts/package-release.sh "${{ matrix.target }}" "$TAG" dist
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  upload-assets:
    needs: [version, build]
    if: >-
      !cancelled() && needs.build.result == 'success' && (
        needs.version.outputs.release_created == 'true' ||
        inputs.tag != ''
      )
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || needs.version.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: aggregate SHA256SUMS and upload
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          gh release upload "$TAG" *.tar.gz SHA256SUMS --clobber

  npm-publish:
    needs: [version, upload-assets]
    if: >-
      !cancelled() && needs.upload-assets.result == 'success' && (
        needs.version.outputs.release_created == 'true' ||
        inputs.tag != ''
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || needs.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || needs.version.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: publish npm wrapper
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not set; skipping npm publish."
            exit 0
          fi
          npm version "${TAG#v}" --no-git-tag-version
          npm publish --access public --provenance
