name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vault_demo
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      VAULT_PG_URL: postgres://postgres:postgres@localhost:5432/vault_demo
      VAULT_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: unit and crate tests
        run: cargo test --workspace

      - name: build
        run: cargo build --workspace

      - name: end-to-end suite against demo-target
        run: |
          PORT=8091 \
          DATABASE_URL="$VAULT_PG_URL" \
          REDIS_URL="$VAULT_REDIS_URL" \
          PAYMENTS_URL=http://127.0.0.1:9095/payments \
          EMAIL_URL=http://127.0.0.1:9095/email \
          ./target/debug/demo-target &
          ./target/debug/vault run --suite-dir tests/flows -v

      - name: negative showcase must fail with exit 1
        env:
          VAULT_RUN_NEGATIVE: ""
        run: |
          set +e
          ./target/debug/vault run --suite-dir tests/flows -t negative
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 1

  distribution:
    name: distribution (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: distribution-${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: npm launcher unit tests
        working-directory: npm
        run: npm test

      - name: build release binary
        run: cargo build --release --locked -p vault --target ${{ matrix.target }}

      - name: package release archive
        run: bash scripts/package-release.sh "${{ matrix.target }}" v0.0.0-dev dist

      - name: packed npm CLI and HTTP-only suite
        env:
          VAULT_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/vault
        run: bash scripts/npm-smoke.sh
