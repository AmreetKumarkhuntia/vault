<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Vault · Test report</title>
__VAULT_STYLE__
</head>
<body>
<header class="masthead">
  <div class="brand"><span class="brand-mark" aria-hidden="true">V</span><span>vault <span class="brand-sub">/ test report</span></span></div>
  <div class="header-actions"><span class="offline-label">Offline report</span><button id="theme-toggle" type="button" aria-label="Switch color theme">Dark theme</button><button id="print-report" type="button">Print</button></div>
</header>
<main>
  <section class="run-intro" aria-labelledby="run-title"><div><h1 id="run-title">Test run</h1><p id="run-context" class="run-context"></p></div><span id="run-status" class="badge">Loading</span></section>
  <dl id="run-metadata" class="run-metadata"></dl>
  <section class="summary" aria-label="Whole-run totals"><div class="summary-caption">Whole run</div><div id="summary-counts" class="summary-counts"></div></section>
  <section class="toolbar" aria-label="Report controls">
    <label class="search-label" for="search-tests"><span>Search</span><input id="search-tests" type="search" placeholder="Test, flow, tag or request path" autocomplete="off"></label>
    <label class="filter-label" for="status-filter"><span>Status</span><select id="status-filter"><option value="ALL">All statuses</option><option value="PASSED">Passed</option><option value="FAILED">Failed</option><option value="ERRORED">Errored</option><option value="SKIPPED">Skipped</option><option value="NOT_RUN">Not run</option></select></label>
    <button id="expand-all" type="button">Expand all</button>
  </section>
  <p id="filter-summary" class="filter-summary" role="status" aria-live="polite"></p>
  <section id="results" aria-label="Flows and tests"></section>
  <noscript><p class="empty-state">Enable JavaScript to explore this report. All report data is embedded in this file; no network connection is needed.</p></noscript>
  <footer>Generated by Vault <span id="report-version"></span><span>Payload previews are limited to 64 KiB after masking.</span></footer>
</main>
<script id="vault-report-data" type="application/json">__VAULT_DATA__</script>
<script>__VAULT_SCRIPT__</script>
</body>
</html>
