[package]
name = "vault-store-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
globset = "0.4.20"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls", "json", "chrono", "uuid"] }
vault-store = { path = "../store" }
walkdir = "2.5.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }

# Integration tests live under the workspace tests/ directory; registering them here keeps
# `cargo test -p` and CARGO_BIN_EXE_* working for this crate.

[[test]]
name = "sql_file"
path = "../../tests/store-postgres/sql_file.rs"


[[test]]
name = "verify"
path = "../../tests/store-postgres/verify.rs"
