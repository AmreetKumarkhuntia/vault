[package]
name = "vault-store-postgres"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
chrono = "0.4.45"
regex = "1.13.1"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls", "json", "chrono", "uuid"] }
vault-store = { path = "../store" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
