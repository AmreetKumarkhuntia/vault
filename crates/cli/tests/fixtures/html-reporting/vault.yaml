version: 1
environments:
  local:
    target:
      base_url: "${env.VAULT_CLI_TEST_URL}"
      health_check: { path: /healthz, timeout: 2s }
    mock_server:
      bind: 127.0.0.1:0
report:
  json: result.json
  junit: result.xml
  html: result.html
  redact:
    headers: [X-Private]
    json_paths: ["$.nested.private"]
    text_patterns: ["cli-pattern-[a-z]+"]
