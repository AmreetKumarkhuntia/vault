[package]
name = "vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anstream = "1.0.0"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
globset = "0.4.20"
owo-colors = "4.4.0"
rand = "0.10.3"
serde_json = "1.0.151"
vault-core = { path = "../core" }
vault-dsl = { path = "../dsl" }
vault-mock = { path = "../mock" }
vault-report = { path = "../report" }
vault-store = { path = "../store" }
vault-store-postgres = { path = "../store-postgres" }
vault-store-redis = { path = "../store-redis" }
tokio = { version = "1.53.1", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
indexmap = "2.14.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }

# Integration tests live under the workspace tests/ directory; registering them here keeps
# `cargo test -p` and CARGO_BIN_EXE_* working for this crate.

[[test]]
name = "cli_behavior"
path = "../../tests/cli/cli_behavior.rs"


[[test]]
name = "sql_file_validation"
path = "../../tests/cli/sql_file_validation.rs"
