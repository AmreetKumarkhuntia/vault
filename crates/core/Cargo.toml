[package]
name = "vault-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls"] }
vault-dsl = { path = "../dsl" }
vault-mock = { path = "../mock" }
vault-store = { path = "../store" }
tokio = { version = "1.53.1", features = ["full"] }
indexmap = "2.14.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
minijinja = "2.24.0"
serde_json_path = "0.7.2"
regex = "1.13.1"
thiserror = "2.0.20"
uuid = { version = "1.26.1", features = ["v4", "v5"] }
chrono = { version = "0.4.45", features = ["serde"] }
rand = "0.10.3"

[dev-dependencies]
async-trait = "0.1.92"

# Integration tests live under the workspace tests/ directory; registering them here keeps
# `cargo test -p` and CARGO_BIN_EXE_* working for this crate.

[[test]]
name = "execution_evidence"
path = "../../tests/core/execution_evidence.rs"


[[test]]
name = "global_seed_lifecycle"
path = "../../tests/core/global_seed_lifecycle.rs"

[[test]]
name = "settle"
path = "../../tests/core/settle.rs"

[[test]]
name = "parallel_mocks"
path = "../../tests/core/parallel_mocks.rs"

[[test]]
name = "undeclared_calls"
path = "../../tests/core/undeclared_calls.rs"

[[test]]
name = "identity"
path = "../../tests/core/identity.rs"
