[package]
name = "vault-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
chrono = "0.4.45"
humantime = "2.4.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.20"

# Integration tests live under the workspace tests/ directory; registering them here keeps
# `cargo test -p` and CARGO_BIN_EXE_* working for this crate.

[[test]]
name = "backward_compatibility"
path = "../../tests/store/backward_compatibility.rs"
