[package]
name = "vault-store-redis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
redis = { version = "1.7.0", features = ["tokio-comp", "connection-manager"] }
regex = "1.13.1"
serde_json = "1.0.151"
vault-store = { path = "../store" }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }

# Integration tests live under the workspace tests/ directory; registering them here keeps
# `cargo test -p` and CARGO_BIN_EXE_* working for this crate.

[[test]]
name = "db_guard"
path = "../../tests/store-redis/db_guard.rs"


[[test]]
name = "live"
path = "../../tests/store-redis/live.rs"
